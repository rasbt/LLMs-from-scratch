[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llms-from-scratch"
version = "1.0.18"
description = "Implement a ChatGPT-like LLM in PyTorch from scratch, step by step"
readme = "README.md"
requires-python = ">=3.10,<3.16"
dependencies = [
  # Keep Intel macOS on older PyTorch wheels.
  "torch>=2.2.2,<2.6; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version <= '3.14'",
  # Transformers v5 requires PyTorch >=2.6 for the bonus materials and tests.
  "torch>=2.6.0; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version <= '3.14'",
  "torch>=2.6.0; sys_platform == 'linux' and python_version <= '3.14'",
  "torch>=2.6.0; sys_platform == 'win32' and python_version <= '3.14'",
  # PyPI wheels for Python 3.15 are available for these platforms.
  "torch>=2.15.0; python_version >= '3.15' and (sys_platform == 'linux' or sys_platform == 'win32' or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
  "jupyterlab>=4.0",
  "tiktoken>=0.5.1; python_version < '3.15'",
  "tiktoken>=0.14.0; python_version >= '3.15'",
  "requests>=2.32.5",
  "matplotlib>=3.7.1",
  "tqdm>=4.66.1",
  "numpy>=1.26",
  "pandas>=2.2.1",
  "pip>=25.0.1",
  "pytest>=9.1.1",
]

[tool.uv]
# Match the platforms covered by the current PyTorch dependencies.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
llms-from-scratch = { workspace = true }

[dependency-groups]
dev = [
    "build>=1.2.2.post1",
    "twine>=6.1.0",
    "tokenizers>=0.22.0",
    "safetensors>=0.6.2",
]
bonus = [
    "blobfile>=3.0.0",
    "chainlit>=1.2.0",
    "huggingface_hub>=0.34.4",
    "ipywidgets>=8.1.2",
    "llms_from_scratch>=1.0.18",
    "openai>=1.30.3",
    "safetensors>=0.6.2",
    "scikit-learn>=1.3.1",
    "sentencepiece>=0.1.99",
    "thop",
    "tokenizers>=0.21.1",
    "transformers>=5.0.0",
    "tqdm>=4.65.0",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
exclude = [".venv"]
ignore = [
    "C406", "E226", "E402", "E702", "E703",
    "E722", "E731", "E741"
]

# `llms_from_scratch` PyPI package
[tool.setuptools]
package-dir = {"" = "pkg"}

[tool.setuptools.packages.find]
where = ["pkg"]
